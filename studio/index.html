<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vandenizar Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<style>
/* Studio follows the Work app: warm-white canvas, oversized light Manrope titles, flat pastel blocks,
   black primary controls. Layout: sidebar on desktop, dock + floating add on phones. */
:root {
  --bg: #f7f6f2; --surface: #fffefa; --surface-2: #f1efe9;
  --ink: #11110f; --ink-2: #4f504c; --muted: #6f706a; --faint: #9a9b94;
  --line: rgba(17,17,15,.11); --line-strong: rgba(17,17,15,.22);
  --butter: #f9e7bd; --cyan: #dceff0; --sage: #dcebdd; --lavender: #e9def7; --rose: #f7dada; --peach: #f8dfcc;
  --btn: #11110f; --btn-ink: #fffefa; --good: #2c8a57; --warn: #9a5a0e; --bad: #c43e39;
  --glass: rgba(255,254,250,.78); --scrim: rgba(17,17,15,.32);
  --r-xl: 30px; --r-lg: 24px; --r-md: 16px;
  --shadow-pop: 0 18px 50px rgba(20,20,16,.16), 0 2px 6px rgba(20,20,16,.06);
  --font-ui: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141412; --surface: #1d1d1a; --surface-2: #262622; --ink: #f3f2ec; --ink-2: #cfcec6; --muted: #a3a39b; --faint: #7a7a73;
  --line: rgba(243,242,236,.1); --line-strong: rgba(243,242,236,.2);
  --butter: #3a3320; --cyan: #1f3335; --sage: #213025; --lavender: #2e2739; --rose: #3b2526; --peach: #3a2b20;
  --btn: #f3f2ec; --btn-ink: #141412; --good: #6fd39a; --warn: #e8b264; --bad: #ff8a84; --glass: rgba(34,34,31,.8); --scrim: rgba(0,0,0,.55);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1d1a; --surface-2: #262622; --ink: #f3f2ec; --ink-2: #cfcec6; --muted: #a3a39b; --faint: #7a7a73;
  --line: rgba(243,242,236,.1); --line-strong: rgba(243,242,236,.2);
  --butter: #3a3320; --cyan: #1f3335; --sage: #213025; --lavender: #2e2739; --rose: #3b2526; --peach: #3a2b20;
  --btn: #f3f2ec; --btn-ink: #141412; --good: #6fd39a; --warn: #e8b264; --bad: #ff8a84; --glass: rgba(34,34,31,.8); --scrim: rgba(0,0,0,.55);
  color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15.5px; line-height: 1.45; font-weight: 450; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: .45; cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
img { max-width: 100%; display: block; }
.row { display: flex; align-items: center; } .col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; } .between { justify-content: space-between; } .grow { flex: 1 1 auto; min-width: 0; }
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; } .tnum { font-variant-numeric: tabular-nums; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.t-butter{background:var(--butter)}.t-cyan{background:var(--cyan)}.t-sage{background:var(--sage)}.t-lavender{background:var(--lavender)}.t-rose{background:var(--rose)}.t-peach{background:var(--peach)}.t-plain{background:var(--surface-2)}

/* shell */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; padding: 28px 18px 18px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
.brand b { display: block; font-size: 25px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.brand span { color: var(--muted); font-size: 14px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 16px; border-radius: 999px; font-size: 16px; color: var(--ink-2); text-align: left; }
.nav button.on { background: var(--btn); color: var(--btn-ink); }
.nav button:not(.on):hover { background: var(--surface-2); }
.side .foot { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.dotok { width: 8px; height: 8px; border-radius: 50%; background: var(--good); } .dotbad { background: var(--bad); }
.main { min-width: 0; padding: 40px 48px 120px; }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.page.narrow { max-width: 760px; }
.dock { display: none; }
.fab { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: calc(20px + var(--sat)) 16px calc(120px + var(--sab)); }
  .dock { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--sab)); z-index: 30; justify-content: space-around; padding: 8px 6px; border-radius: 34px; background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); box-shadow: var(--shadow-pop); }
  .dock button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); padding: 6px 8px; border-radius: 22px; min-width: 58px; }
  .dock button.on { color: var(--ink); font-weight: 650; }
  .dock button.on .ico { background: var(--btn); color: var(--btn-ink); }
  .dock .ico { width: 44px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .fab { display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(96px + var(--sab)); width: 58px; height: 58px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); z-index: 31; box-shadow: var(--shadow-pop); }
}

/* type & controls */
.hello { color: var(--ink-2); font-size: 18px; }
.date-eyebrow { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
h1.big { font-size: clamp(44px, 8vw, 84px); font-weight: 500; letter-spacing: -.055em; line-height: .95; margin: 6px 0 0; text-wrap: balance; }
h1.pt { font-size: clamp(34px, 5vw, 52px); font-weight: 500; letter-spacing: -.045em; line-height: 1; margin: 0; }
h2 { font-size: 24px; font-weight: 550; letter-spacing: -.03em; margin: 0; }
h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0; }
.btn { height: 44px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 15px; box-shadow: inset 0 0 0 1px var(--line-strong); white-space: nowrap; }
.btn.primary { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }
.btn.ghost { box-shadow: none; } .btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.addbtn { height: 54px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); display: flex; align-items: center; gap: 12px; padding: 0 22px; font-size: 16px; font-weight: 600; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }
.chip { height: 38px; padding: 0 15px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--ink-2); }
.chip.on { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.chip .n { font-size: 12px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; }
.chip.on .n { background: var(--btn-ink); color: var(--btn); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--line-strong); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 26px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .lbl { font-size: 13.5px; color: var(--muted); font-weight: 550; }
.input, .select, textarea.input { width: 100%; min-height: 48px; padding: 12px 15px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); outline: none; }
.input:focus, textarea.input:focus { border-color: var(--ink); }
textarea.input { resize: vertical; line-height: 1.5; }
.select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.title-input { width: 100%; border: 0; background: transparent; font-size: clamp(30px, 5vw, 46px); font-weight: 500; letter-spacing: -.045em; line-height: 1.05; outline: none; padding: 0; resize: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); gap: 2px; max-width: 100%; overflow-x: auto; align-self: flex-start; }
.seg button { flex: none; }
.seg button { height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
input[type=range] { width: 100%; accent-color: var(--ink); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* today */
.bento { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 16px; }
.tile { border-radius: var(--r-xl); padding: 24px; min-height: 190px; display: flex; flex-direction: column; text-align: left; }
.tile .ti { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; margin-bottom: auto; }
.tile .tl { color: var(--ink-2); margin-top: 22px; }
.tile .tv { font-size: 46px; font-weight: 450; letter-spacing: -.04em; line-height: 1.05; }
.tile .ts { font-size: 19px; }
@media (max-width: 860px) { .bento { grid-template-columns: 1fr 1fr; } .bento .tile:first-child { grid-row: span 2; } .tile { min-height: 150px; padding: 18px; } .tile .tv { font-size: 38px; } }
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; align-items: start; }
@media (max-width: 960px) { .two { grid-template-columns: 1fr; } }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.slot { border-radius: var(--r-lg); padding: 18px; min-height: 150px; display: flex; flex-direction: column; gap: 6px; text-align: left; position: relative; overflow: hidden; }
.slot .sh { display: flex; justify-content: space-between; font-weight: 650; font-size: 14px; }
.slot .sh span:last-child { font-weight: 500; color: var(--ink-2); }
.slot .st { font-size: 18px; letter-spacing: -.02em; }
.slot .plus { margin-top: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.slot.has { color: #fffefa; }
.slot.has .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.slot.has .bgimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.05) 50%, rgba(0,0,0,.5)); }
.slot.has > *:not(.bgimg) { position: relative; } .slot.has .sh span:last-child { color: rgba(255,255,255,.85); }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 1.6px solid var(--ink-2); flex: none; display: grid; place-items: center; }
.check.done { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.item .it { font-size: 16.5px; } .item .is { font-size: 13.5px; color: var(--muted); }
.late { background: var(--rose); border-radius: var(--r-md); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.thumb { width: 44px; height: 58px; border-radius: 10px; background-size: cover; background-position: center; flex: none; }

/* pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
.colm { background: var(--surface-2); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 260px; scroll-snap-align: start; }
.colm.drop { outline: 2px dashed var(--ink-2); outline-offset: -4px; }
.colm .ch { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; font-weight: 650; }
.kcard { background: var(--surface); border-radius: var(--r-md); padding: 10px; display: flex; gap: 10px; text-align: left; border: 1px solid var(--line); cursor: grab; }
.kcard .kt { font-weight: 600; font-size: 15px; line-height: 1.25; }
.kcard .ks { font-size: 12.5px; color: var(--muted); }
.kcard .nx { margin-left: auto; align-self: center; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 0 6px; }
.cal .day { min-height: 104px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 7px; display: flex; flex-direction: column; gap: 4px; text-align: left; overflow: hidden; }
.cal .day.out { opacity: .4; } .cal .day.today { border-color: var(--ink); }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.cal .dn { font-size: 13px; font-weight: 650; }
.cal .ev { font-size: 12px; border-radius: 7px; padding: 2px 6px; font-weight: 600; }
.cal .sl { font-size: 11px; color: var(--faint); }
@media (max-width: 640px) { .cal .day { min-height: 56px; padding: 5px; } .cal .ev { font-size: 0; height: 7px; padding: 0; } .cal .sl { display: none; } }

/* feed preview */
.phone { width: 100%; max-width: 420px; margin: 0 auto; background: #fff; color: #0c0c0c; border-radius: 34px; box-shadow: var(--shadow-pop); overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
.phone .ph { padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.phone .uname { font-weight: 700; font-size: 18px; }
.phone .stats { display: flex; align-items: center; gap: 18px; }
.phone .av { width: 80px; height: 80px; border-radius: 50%; background: #e7e3da center/cover; flex: none; border: 1px solid rgba(0,0,0,.08); }
.phone .st b { display: block; font-size: 16px; } .phone .st { font-size: 13px; text-align: center; }
.phone .bio { font-size: 13.5px; line-height: 1.35; white-space: pre-line; }
.phone .tabs { display: flex; border-top: 1px solid #eee; }
.phone .tabs button { flex: 1; height: 44px; display: grid; place-items: center; color: #999; border-bottom: 1.5px solid transparent; }
.phone .tabs button.on { color: #0c0c0c; border-color: #0c0c0c; }
.igrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #fff; }
.igrid .cell { aspect-ratio: 3/4; position: relative; background: #ddd center/cover; overflow: hidden; color: #fff; text-align: left; }
.igrid.reels .cell { aspect-ratio: 9/16; }
.igrid .cell .ph-t { position: absolute; inset: 0; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; font-weight: 600; color: var(--ink); }
.igrid .cell .badge { position: absolute; top: 6px; right: 6px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); color: #fff; }
.igrid .cell .sched { position: absolute; left: 6px; top: 6px; font-size: 10.5px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 2px 6px; }
.igrid .cell.picked { outline: 3px solid #3897f0; outline-offset: -3px; }
.igrid .cell .num { position: absolute; bottom: 6px; right: 6px; font-size: 11px; background: rgba(0,0,0,.55); border-radius: 6px; padding: 1px 6px; }

/* overlay & sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 861px) { .scrim { align-items: center; } }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: calc(100% - 30px); overflow: auto; border-radius: 28px 28px 0 0; padding: 22px 22px calc(26px + var(--sab)); display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 861px) { .sheet { border-radius: 28px; max-height: 88vh; } }
.sheet.wide { max-width: 1040px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-h h2 { font-size: 26px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + var(--sab)); background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 12px 20px; z-index: 80; display: flex; gap: 16px; align-items: center; font-weight: 600; box-shadow: var(--shadow-pop); max-width: calc(100% - 32px); }
.toast button { text-decoration: underline; font-weight: 700; }
@media (min-width: 861px) { .toast { bottom: 30px; } }
.menu { position: fixed; z-index: 70; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-pop); padding: 6px; min-width: 200px; border: 1px solid var(--line); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; text-align: left; font-weight: 550; }
.menu button:hover { background: var(--surface-2); }

/* post */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cover-prev { width: 150px; border-radius: 14px; overflow: hidden; background: var(--surface-2); flex: none; }
.slides { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.slide { width: 96px; flex: none; aspect-ratio: 3/4; border-radius: 12px; background: var(--surface-2) center/cover; position: relative; }
.slide .sx { position: absolute; inset: auto 4px 4px 4px; display: flex; justify-content: space-between; }
.slide .sx button { width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; }
.swipe { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 16px; background: #000; }
.swipe > div { flex: 0 0 100%; aspect-ratio: 3/4; scroll-snap-align: center; background: #111 center/cover; }
.ai { background: var(--lavender); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.ai .out { background: var(--surface); border-radius: var(--r-md); padding: 14px; white-space: pre-wrap; font-size: 15px; max-height: 340px; overflow: auto; }

/* cover editor */
.ced { display: grid; grid-template-columns: minmax(0, 400px) 1fr; grid-template-areas: 'stage rc' 'lc rc'; gap: 16px 24px; align-items: start; }
.ced .cstage { grid-area: stage; } .ced .lc { grid-area: lc; } .ced .rc { grid-area: rc; }
@media (max-width: 860px) { .ced { grid-template-columns: 1fr; } }
.ced > * { min-width: 0; }
@media (max-width: 860px) {
  .ced { display: block; }
  .ced > * + * { margin-top: 16px; }
  .ced .cstage { position: sticky; top: -22px; z-index: 3; width: min(46vw, 200px); margin: 0 auto; box-shadow: var(--shadow-pop); }
}
.cstage { position: relative; border-radius: 16px; overflow: hidden; background: #111; }
.cstage canvas { width: 100%; display: block; }
.cstage .guide { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.75); border-bottom: 1.5px dashed rgba(255,255,255,.75); pointer-events: none; }
.cstage .guide span { position: absolute; right: 6px; top: 4px; font-size: 10px; color: #fff; background: rgba(0,0,0,.5); border-radius: 5px; padding: 1px 5px; }
.lines { display: flex; flex-direction: column; gap: 10px; }
.lnr { display: grid; grid-template-columns: 1fr 112px 36px; gap: 8px; align-items: center; }
.lnr .input { min-height: 42px; padding: 9px 12px; }
.lctl { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }

  const month = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'][d.getMonth()] + ' ' + d.getFullYear();

  const [d, setD] = useState(date || nextDateFor(pillar || (pls[0] && pls[0].id)));

/* ----- Today ----- */
function Today() {
  useStore(); const t = today(); const ws = weekStart(t);
  const posts = livePosts();
  const week = posts.filter((p) => p.date && p.date >= ws && p.date <= addDays(ws, 6));
  const steps = posts.flatMap(stepsOf);
  const due = steps.filter((s) => s.date === t);
  const late = steps.filter((s) => s.date < t);
  const ideas = posts.filter((p) => p.stage === 'idea').length;
  const posted = week.filter((p) => p.stage === 'posted').length;
  const upcoming = steps.filter((s) => s.date > t && s.date <= addDays(t, 7)).sort((a, b) => a.date.localeCompare(b.date));
  const hr = new Date().getHours(); const greet = hr < 11 ? 'Good morning' : hr < 15 ? 'Good afternoon' : hr < 19 ? 'Good evening' : 'Good night';

/* ----- Calendar ----- */
function CalendarPage() {
  useStore(); const t = today();
  const [month, setMonth] = useState(t.slice(0, 7)); const [sel, setSel] = useState(t);
  const first = month + '-01'; const start = weekStart(first);
  const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  const posts = livePosts(); const byDate = {}; posts.forEach((p) => { if (p.date) (byDate[p.date] = byDate[p.date] || []).push(p); });
  const threadsBy = {}; liveThreads().forEach((th) => { if (th.date) threadsBy[th.date] = (threadsBy[th.date] || 0) + 1; });
  const shift = (n) => { const d = parse(first); d.setMonth(d.getMonth() + n); setMonth(iso(d).slice(0, 7)); };
  const mName = MONTHS[parse(first).getMonth()] + ' ' + parse(first).getFullYear();
  const selPosts = byDate[sel] || []; const selSlots = pillars().filter((p) => p.day === dow(sel) && !selPosts.some((x) => x.pillar === p.id));
  const undated = posts.filter((p) => !p.date && p.stage !== 'posted');
  return html`<div class="page">
    <div class="row between wrap gap-12"><h1 class="pt">${mName}</h1><div class="row gap-6"><button class="icon-btn" aria-label="Previous month" onClick=${() => shift(-1)}><${Icon} n="left" /></button><button class="btn sm" onClick=${() => { setMonth(t.slice(0, 7)); setSel(t); }}>Today</button><button class="icon-btn" aria-label="Next month" onClick=${() => shift(1)}><${Icon} n="right" /></button></div></div>
    <div class="cal">${DAYS.map((d) => html`<div class="dow">${d}</div>`)}
      ${days.map((d) => { const list = byDate[d] || []; const slots = pillars().filter((p) => p.day === dow(d) && !list.some((x) => x.pillar === p.id));
        return html`<button class=${'day' + (d.slice(0, 7) !== month ? ' out' : '') + (d === t ? ' today' : '') + (d === sel ? ' sel' : '')} onClick=${() => setSel(d)}>
          <span class="dn">${parse(d).getDate()}</span>
          ${list.map((p) => html`<span class=${'ev ellipsis t-' + pillarOf(p.pillar).tint} style=${p.stage === 'posted' ? 'opacity:.6;text-decoration:line-through' : ''}>${p.title || 'Untitled'}</span>`)}
          ${d >= t && slots.map((p) => html`<span class="sl ellipsis">+ ${p.name}</span>`)}
          ${threadsBy[d] ? html`<span class="sl">${threadsBy[d]} thread${threadsBy[d] > 1 ? 's' : ''}</span>` : ''}
        </button>`; })}
    </div>
    <div class="card col gap-12">
      <div class="row between"><h2>${fmtDay(sel)}</h2><button class="btn sm primary" onClick=${() => openOverlay((c) => html`<${NewPost} close=${c} date=${sel} />`)}><${Icon} n="plus" s=${16} />Post</button></div>
      ${selPosts.length === 0 && selSlots.length === 0 ? html`<span class="muted">Nothing on this day.</span>` : ''}
      <div class="list">${selPosts.map((p) => html`<button class="item" onClick=${() => openPost(p.id)}><${Dot} tint=${pillarOf(p.pillar).tint} /><span class="grow col"><span class="it">${p.title || 'Untitled post'}</span><span class="is">${pillarOf(p.pillar).name}</span></span><${StagePill} id=${p.stage} /></button>`)}
      ${selSlots.map((pl) => html`<button class="item" onClick=${() => openOverlay((c) => html`<${NewPost} close=${c} date=${sel} pillar=${pl.id} />`)}><${Dot} tint=${pl.tint} /><span class="grow muted">${pl.name} slot · plan a post</span><${Icon} n="plus" s=${18} /></button>`)}</div>

async function exportSlides(p) {
  const ids = [...(p.cover && p.cover.renderId ? [p.cover.renderId] : []), ...(p.slides || [])];
  const base = (p.title || 'carousel').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase();
  for (let i = 0; i < ids.length; i++) {
    try { const b = await (await fetch(assetSrc(ids[i]))).blob(); await downloads.save({ filename: `${base}-${String(i + 1).padStart(2, '0')}.jpg`, data: b }); }
    catch (e) { if (e && e.code === 'declined') return; toast('Could not export slide ' + (i + 1)); return; }
  }
}
async function saveCoverFile(p) {
  try { const r = await fetch(assetSrc(p.cover.renderId)); const b = await r.blob(); await downloads.save({ filename: (p.title || 'cover').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.jpg', data: b }); }
  catch (e) { if (e && e.code !== 'declined') toast('Could not save the image.'); }
}

// Storytelling method from Denizar's vandenizar-storytelling skill (anatta.ha method), condensed for Claude inside the page.
const STORY_METHOD = `Storytelling method (follow it):
1. He is the main character. The video is about WHY he does something, not WHAT he does. Test: could someone else post the exact same video? If yes, go one "why" deeper until only he could say it.
2. Never invent his life. Use only events, feelings and details from his story notes, hook, notes or script below. Where a real personal detail is missing, write a placeholder in [square brackets] describing what to fill in. A made-up client, failure or feeling is never written as fact.
3. Four beats, 45-60 seconds, about 100-150 Indonesian words, short spoken sentences:
   - Ngaku (0-4 s): one first-person line with a feeling or a real moment. No topic announcement.
   - Kenapa (4-25 s): three concrete, slightly embarrassing details only he has.
   - Belokan (25-45 s): the turn ("Dari situ...", "Aku baru sadar..."). Any tutorial content lives here, framed by the story.
   - Penutup jujur (45-55 s): short, honest, unfinished is fine. Light humour or a blooper is welcome. Never ask for follows.
4. Hooks are confessions, never suspense. Patterns: "Aku [nggak suka/takut/malu] [hal spesifik]." / "Orang bilang aku [label]. Mungkin ada benernya." / "[X] tahun aku [kebiasaan], dan baru sekarang aku sadar..." / "Ada satu kalimat klien yang masih aku inget." / "Ini percobaan kedua aku [hal]."
5. Voice: on camera he says "aku/kamu", casual spoken Indonesian (kalo, sampe, nggak). If a line sounds written, cut or split it.
6. Visuals: show what the line says, plainly. Shot size follows emotion (uneasy = extreme close-ups, POV hands, black screen; relief = wide). A black card with one word before a heavy line. Old clips in a small window on black. One handmade recurring prop as an insert. End on a blooper or an awkward real moment. Prefer footage he likely has (desk, room, coffee shop, gym, laptop timeline, camera).

    if (f.type.startsWith('video/')) { setVideo(url); setImg(null); upd({ photoId: null }); }
    else { setVideo(null); loadImg(url).then((im) => { setImg(im); im._file = f; }); upd({ photoId: null }); }
  };
  const grabFrame = () => { const v = vref.current; if (!v) return; const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0); c.toBlob((b) => { const u = URL.createObjectURL(b); loadImg(u).then((im) => { im._file = b; setImg(im); setVideo(null); }); }, 'image/jpeg', 0.92); };
  const save = async () => {
    if (!assets) return toast('Saving covers needs the page opened in Claude.');
    setBusy(true);
    if (slideMode) {
      try { let photoId = cfg.photoId; if (img && img._file && !photoId) photoId = (await assets.upload(await shrink(img._file))).id; const { renderId, ...rest } = cfg; onSave({ ...rest, photoId }, photoId); close(); }
      catch (e) { toast('Could not save. Try a smaller photo.'); }
      setBusy(false); return;
    }
    try {
      let photoId = cfg.photoId;
      if (img && img._file && !photoId) { const r = await assets.upload(await shrink(img._file)); photoId = r.id; }
      const blob = await render('image/jpeg');
      const rr = await assets.upload(blob);
      const old = p.cover && p.cover.renderId;
      savePost(p.id, { cover: { ...cfg, photoId, renderId: rr.id } }, 0);
      if (old && old !== rr.id) assets.delete(old).catch(() => {});
      close(); toast('Cover saved');
    } catch (e) { toast('Could not save the cover. Try a smaller photo.'); }
    setBusy(false);
  };
  const askIdeas = async () => {
    if (!sample) return;
    setIdeas('loading');
    try {
      const v = await sample.json(`${postContext(p)}\nWrite cover text for this post in the style of cinematic lifestyle covers (examples: "A MAGIC OF / Practical Light", "HOW TO CREATE / MOVING POSTCARD / My Little Journey", "Healing Journey / RECHARGE BY CHANGING YOUR ROUTINE.", "A DAY DIARY / a *peace* in my Mind", "1 SCENE 5 SHOTS / a shot is the moment the camera starts rolling"). Give 3 options. Each option is an array of 2-4 lines; each line has "text" and "role": label (a short spaced-caps kicker above the title), title (2-4 words, mixed case serif; wrap one word in *asterisks* to set it in italic), caps (the title in condensed serif capitals instead), script (one word in script), small (a one or two line tagline). Use \n inside a title to break it into two lines. English. Return JSON: {"options": [[{"text":"","role":""}]]}.`, { modelTier: 'quick' });
      setIdeas((v && v.options) || []);
    } catch (e) { setIdeas(null); toast('Claude could not answer. Try again.'); }
  };
  const ROLE = { label: { font: 'avenir-bold', size: 30, ls: 0.16 }, title: { font: 'editors-regular', size: 170, lh: 0.86 }, caps: { font: 'garamond-regular', size: 160, upper: true, hs: 0.84, lh: 0.88 }, script: { font: 'vivaldi', size: 180, lh: 0.9 }, small: { font: 'avenir-regular', size: 20, upper: true, ls: 0.04 } };
  const lineOf = (l) => ({ ...(ROLE[l.role] || ROLE.title), text: String(l.text || '') });
  const useIdea = (lines) => { upd({ lines: lines.map(lineOf) }); setIdeas(null); };
  return html`<div class="sheet wide">
    <div class="sheet-h wrap gap-8"><h2>${slideMode ? 'Cover layout' : 'Cover'}</h2><div class="row gap-6 wrap">
      <button class="btn sm ghost" onClick=${close}>Close</button>
      ${downloads && html`<button class="btn sm" disabled=${!!busyX} onClick=${(e) => openMenu(e, [{ label: 'JPG, ' + W + ' × ' + H, icon: 'download', run: () => exportAs('image/jpeg') }, { label: 'PNG, ' + W + ' × ' + H, icon: 'download', run: () => exportAs('image/png') }, { label: 'PNG, text only, see-through', icon: 'download', run: () => exportAs('image/png', true) }])}><${Icon} n="download" s=${16} />${busyX === 'export' ? 'Exporting…' : 'Export'}</button>`}
      <button class="btn sm primary" disabled=${busy} onClick=${save}>${busy ? 'Saving…' : slideMode ? 'Use on slide' : 'Save cover'}</button></div></div>
    <div class="ced">
      <div class="cstage" style=${`aspect-ratio:${W}/${H}`}>
        <canvas ref=${cv} width=${W} height=${H}></canvas>
        ${guide && fmt === 'reels' && html`<div class="guide" style=${`top:${crop.top * 100}%;height:${crop.h * 100}%`}><span>Grid shows this part</span></div>`}
      </div>
      <div class="col gap-12 lc">
        ${video && html`<div class="col gap-8"><video ref=${vref} src=${video} muted playsinline preload="auto" style="width:100%;border-radius:12px" onLoadedMetadata=${(e) => setVt(0)}></video>
          <input type="range" min="0" max="1000" value=${vt} aria-label="Pick a frame" onInput=${(e) => { const v = vref.current; setVt(+e.currentTarget.value); if (v && v.duration) v.currentTime = v.duration * (+e.currentTarget.value / 1000); }} />
          <button class="btn primary" onClick=${grabFrame}>Use this frame</button></div>`}
        <div class="row gap-8 wrap">
          <label class="btn sm" for="cv-file"><${Icon} n="image" s=${16} />Photo or video</label>
          <input type="file" id="cv-file" accept="image/*,video/*" hidden onChange=${(e) => { onFile(e.currentTarget.files[0]); e.currentTarget.value = ''; }} />
          ${fmt === 'reels' && html`<button class=${'chip' + (guide ? ' on' : '')} onClick=${() => setGuide(!guide)}>Grid guide</button>`}
        </div>
        ${!slideMode && html`<div class="field"><span class="lbl">Post type</span><div class="seg">${FORMATS.map((f) => html`<button class=${S.posts[p.id].format === f.id ? 'on' : ''} onClick=${() => { savePost(p.id, { format: f.id }, 0); upd({ ratio: fitRatio(cfg.ratio, f.id) }); }}>${f.name}</button>`)}</div>
          <span class="small muted">${S.posts[p.id].format === 'reels' ? 'Reels show in the grid and the Reels tab, so the cover is 9:16.' : 'Carousels and photos show in the grid only, not the Reels tab.'}</span></div>
        ${ratiosFor(S.posts[p.id].format).length > 1 && html`<div class="field"><span class="lbl">Size</span><div class="seg">${ratiosFor(S.posts[p.id].format).map((k) => html`<button class=${fmt === k ? 'on' : ''} onClick=${() => upd({ ratio: k })}>${RATIOS[k].name}</button>`)}</div>
          <span class="small muted">${fmt === 'reels' ? 'The profile grid shows the middle 3:4.' : fmt === '3:4' ? 'Same shape as the profile grid.' : fmt === '4:5' ? 'Classic feed size. The grid trims a little off the sides.' : 'The grid trims the sides to 3:4.'}${S.posts[p.id].format === 'carousel' ? ' Keep every slide in one size.' : ''}</span></div>`}`}
        ${img && html`<div class="grid2">
          <div class="field"><label for="cz">Zoom</label><input type="range" id="cz" min="1" max="2.5" step="0.01" value=${cfg.zoom || 1} onInput=${(e) => upd({ zoom: +e.currentTarget.value })} /></div>
          <div class="field"><label for="cg">Darken behind text</label><input type="range" id="cg" min="0" max="0.8" step="0.01" value=${cfg.grade} onInput=${(e) => upd({ grade: +e.currentTarget.value })} /></div>
          <div class="field"><label for="cpx">Photo left / right</label><input type="range" id="cpx" min="-1" max="1" step="0.01" value=${cfg.px || 0} onInput=${(e) => upd({ px: +e.currentTarget.value })} /></div>
          <div class="field"><label for="cpy">Photo up / down</label><input type="range" id="cpy" min="-1" max="1" step="0.01" value=${cfg.py || 0} onInput=${(e) => upd({ py: +e.currentTarget.value })} /></div>
        </div>`}
      </div>
      <div class="col gap-16 rc">
        <div class="field"><span class="lbl">Layout</span><div class="presets">${Object.entries(PRESETS).map(([k, pr]) => html`<button class=${'chip' + (cfg.preset === k ? ' on' : '')} onClick=${() => applyPreset(k)}>${pr.name}</button>`)}</div></div>
        ${sample && html`<div class="col gap-8">
          <button class="btn sm" style="align-self:flex-start" disabled=${ideas === 'loading'} onClick=${askIdeas}><${Icon} n="spark" s=${16} />${ideas === 'loading' ? 'Thinking…' : 'Cover text ideas'}</button>
          ${Array.isArray(ideas) && ideas.map((op) => html`<button class="card" style="padding:12px 14px;text-align:center;border-radius:14px" onClick=${() => useIdea(op)}>${op.map((l) => { const n = lineOf(l); return html`<div style=${`font-family:"${fam(n.font)}";font-size:${n.size > 60 ? 22 : 11}px;line-height:1.1;letter-spacing:${(n.ls || 0)}em;white-space:pre-line;text-transform:${n.upper ? 'uppercase' : 'none'}`}>${n.text.replace(/\*/g, '')}</div>`; })}</button>`)}
        </div>`}
        <div class="field"><span class="lbl">Text lines</span>
          <div class="lines">${cfg.lines.map((l, i) => html`<div class="col gap-6">
            <div class="lnr">
              <textarea class="input" rows=${String(l.text).includes('\n') ? 2 : 1} aria-label=${'Line ' + (i + 1)} value=${l.text} onInput=${(e) => setLine(i, { text: e.currentTarget.value })} style=${`font-family:"${fam(l.font)}";font-size:17px`}></textarea>
              <select class="select input" aria-label=${'Font of line ' + (i + 1)} value=${l.font} onChange=${(e) => setLine(i, { font: e.currentTarget.value })}>${FONT_GROUPS.map((g) => html`<optgroup label=${g}>${Object.entries(FONT_LIB).filter(([, v]) => v[1] === g).map(([k, v]) => html`<option value=${k}>${v[0]}</option>`)}</optgroup>`)}</select>
              <button class="icon-btn" aria-label=${'Remove line ' + (i + 1)} onClick=${() => upd({ lines: cfg.lines.filter((_, j) => j !== i) })}><${Icon} n="x" s=${17} /></button>
            </div>
            <div class="lctl">
              <label>Size<input type="range" min="12" max="240" value=${l.size} aria-label=${'Size of line ' + (i + 1)} onInput=${(e) => setLine(i, { size: +e.currentTarget.value })} /></label>
              <label>Spacing<input type="range" min="0" max="0.4" step="0.01" value=${l.ls || 0} aria-label=${'Letter spacing of line ' + (i + 1)} onInput=${(e) => setLine(i, { ls: +e.currentTarget.value })} /></label>
              <label>Width<input type="range" min="0.7" max="1" step="0.01" value=${l.hs || 1} aria-label=${'Width of line ' + (i + 1)} onInput=${(e) => setLine(i, { hs: +e.currentTarget.value })} /></label>
              <button class=${'chip' + (l.upper ? ' on' : '')} style="height:32px;padding:0 12px" onClick=${() => setLine(i, { upper: !l.upper })}>AA</button>
            </div>
            <div class="row gap-6 wrap">
              ${cfg.blocks.length > 1 && html`<select class="select input" style="width:auto;min-height:34px;padding:5px 34px 5px 12px;font-size:13px;background-position:calc(100% - 18px) 14px,calc(100% - 13px) 14px" aria-label=${'Group of line ' + (i + 1)} value=${Math.min(l.b || 0, cfg.blocks.length - 1)} onChange=${(e) => setLine(i, { b: +e.currentTarget.value })}>${cfg.blocks.map((_, j) => html`<option value=${j}>Group ${j + 1}</option>`)}</select>`}
              <button class=${'chip' + (l.fit ? ' on' : '')} style="height:32px;padding:0 12px;font-size:13px" onClick=${() => setLine(i, { fit: !l.fit })}>Fill width</button>
            </div>
          </div>`)}</div>
          <span class="small muted">Wrap a word in *stars* to set it in italic, like a *peace* in my Mind.</span>
          <button class="btn sm ghost" style="align-self:flex-start" onClick=${() => upd({ lines: [...cfg.lines, { text: 'New line', font: 'editors-regular', size: 90, b: cfg.blocks.length - 1 }] })}><${Icon} n="plus" s=${16} />Add line</button>
        </div>
        <div class="col gap-12">${cfg.blocks.map((blk, bi) => html`<div class="card col gap-8" style="padding:14px 16px;border-radius:16px">
          <div class="row between"><b class="small">${cfg.blocks.length > 1 ? 'Group ' + (bi + 1) : 'Text placement'}</b>${cfg.blocks.length > 1 && html`<button class="icon-btn" style="width:30px;height:30px" aria-label=${'Remove group ' + (bi + 1)} onClick=${() => setCfg((c) => ({ ...c, blocks: c.blocks.filter((_, j) => j !== bi), lines: c.lines.filter((l) => (l.b || 0) !== bi).map((l) => ((l.b || 0) > bi ? { ...l, b: l.b - 1 } : l)) }))}><${Icon} n="x" s=${15} /></button>`}</div>
          <div class="seg">${['left', 'center', 'right'].map((a) => html`<button class=${(blk.align || 'center') === a ? 'on' : ''} onClick=${() => setBlock(bi, { align: a })}>${a[0].toUpperCase() + a.slice(1)}</button>`)}</div>
          <label class="lbl">Up / down<input type="range" min="0.03" max="0.97" step="0.01" value=${blk.y} aria-label=${'Position of group ' + (bi + 1)} onInput=${(e) => setBlock(bi, { y: +e.currentTarget.value })} /></label>
          <label class="lbl">Text box width<input type="range" min="0.3" max="1" step="0.01" value=${blk.w || 1} aria-label=${'Width of group ' + (bi + 1)} onInput=${(e) => setBlock(bi, { w: +e.currentTarget.value })} /></label>
        </div>`)}
          <button class="btn sm ghost" style="align-self:flex-start" onClick=${() => setCfg((c) => ({ ...c, blocks: [...c.blocks, { y: 0.5, align: 'center', w: 1 }], lines: [...c.lines, { text: 'New text', font: 'editors-regular', size: 90, b: c.blocks.length }] }))}><${Icon} n="plus" s=${16} />Add text group</button>
          <span class="small muted">Groups let text sit in different places, like a magazine masthead on top and cover lines on the side.</span>
        </div>
        <div class="field"><span class="lbl">Text color</span><div class="row gap-8">${COLORS.map((c) => html`<button class=${'swatch' + (cfg.color === c ? ' on' : '')} style=${`background:${c}`} aria-label=${'Color ' + c} onClick=${() => upd({ color: c })}></button>`)}<button class=${'chip' + (cfg.shadow ? ' on' : '')} onClick=${() => upd({ shadow: !cfg.shadow })}>Soft shadow</button></div></div>
      </div>
    </div>
  </div>`;
}

/* ----- Threads ----- */
function ThreadsPage() {
  useStore(); const [text, setText] = useState(''); const [d, setD] = useState(today()); const [busy, setBusy] = useState(false); const [drafts, setDrafts] = useState([]);
  const list = liveThreads().sort((a, b) => (a.postedAt ? 1 : 0) - (b.postedAt ? 1 : 0) || (a.date || '9999').localeCompare(b.date || '9999'));
  const add = (t = text, date = d) => { if (!t.trim()) return; const id = uid(); saveThread(id, { text: t.trim(), date }); if (t === text) setText(''); };
  const draft = async () => {
    if (!sample) return; setBusy(true);
    try { const recent = livePosts().slice(-5).map((p) => '- ' + (p.title || '')).join('\n');
      const v = await sample.json(`${ABOUT}\nHis Threads pillars: life as a fashion videographer, work-from-home desk setup, desk gear he uses (some affiliate). Recent Instagram posts:\n${recent}\nWrite 5 separate Threads posts, each 1-3 short lines, casual, specific to his days, no hashtags. ${langLine()}\n${STYLE_GUARD}\nReturn JSON: {"posts": ["..."]}`, { modelTier: 'quick' });
      setDrafts((v && v.posts) || []);
    } catch (e) { toast('Claude could not answer. Try again.'); }
    setBusy(false);
  };
  return html`<div class="page narrow">
    <h1 class="pt">Threads</h1>
    <div class="card col gap-12">
      <textarea class="input" id="th-text" rows="3" placeholder="Write a thread" value=${text} onInput=${(e) => setText(e.currentTarget.value)}></textarea>
      <div class="row gap-8 wrap"><input type="date" class="input" style="width:auto" aria-label="Date" value=${d} onInput=${(e) => setD(e.currentTarget.value)} /><button class="btn primary" onClick=${() => add()}>Add</button>${sample && html`<button class="btn" disabled=${busy} onClick=${draft}><${Icon} n="spark" s=${16} />${busy ? 'Writing…' : 'Draft 5 with Claude'}</button>`}</div>
      ${drafts.length > 0 && html`<div class="list">${drafts.map((t, i) => html`<div class="item"><span class="grow" style="white-space:pre-wrap">${t}</span><button class="btn sm" onClick=${() => { add(t, d); setDrafts(drafts.filter((_, j) => j !== i)); }}>Keep</button></div>`)}</div>`}
    </div>
    <div class="list">${list.length === 0 ? html`<div class="empty">No threads yet.</div>` : list.map((th) => html`<div class="item">
      <button class=${'check' + (th.postedAt ? ' done' : '')} aria-label=${th.postedAt ? 'Mark not posted' : 'Mark posted'} onClick=${() => saveThread(th.id, { postedAt: th.postedAt ? null : Date.now() })}>${th.postedAt && html`<${Icon} n="check" s=${16} w=${2.4} />`}</button>
      <div class="grow col gap-4"><span style=${'white-space:pre-wrap;' + (th.postedAt ? 'color:var(--muted)' : '')}>${th.text}</span><span class="is muted small">${th.date ? fmtDay(th.date) : 'No date'}</span></div>
      <button class="icon-btn" aria-label="Copy" onClick=${() => navigator.clipboard.writeText(th.text).then(() => toast('Copied'), () => {})}><${Icon} n="copy" s=${18} /></button>
      <button class="icon-btn" aria-label="Delete" onClick=${() => { saveThread(th.id, { deletedAt: Date.now() }); toast('Thread deleted', { label: 'Undo', run: () => saveThread(th.id, { deletedAt: null }) }); }}><${Icon} n="trash" s=${18} /></button>
    </div>`)}</div>
  </div>`;
}

          <select class="select input" aria-label="Format" value=${p.format} onChange=${(e) => setP(i, { format: e.currentTarget.value })}>${FORMATS.map((f) => html`<option value=${f.id}>${f.name}</option>`)}</select>

        <div class="row gap-6">${TINTS.map((t) => html`<button class=${'swatch t-' + t + (p.tint === t ? ' on' : '')} aria-label=${'Color ' + t} onClick=${() => setP(i, { tint: t })}></button>`)}</div>
      </div>`)}
      <button class="btn sm" style="align-self:flex-start" onClick=${() => saveSettings({ pillars: [...pls, { id: uid(), name: 'New pillar', day: null, format: 'reels', tint: TINTS[pls.length % TINTS.length], hint: '' }] })}><${Icon} n="plus" s=${16} />Add pillar</button>
    </div>
    <div class="card col gap-14" style="gap:14px">
      <h2>Feed profile</h2>
      <div class="row gap-12"><span class="av" style=${`width:64px;height:64px;border-radius:50%;background:var(--surface-2) center/cover;${st.profile.avatarId ? `background-image:url(${assetSrc(st.profile.avatarId)})` : ''}`}></span>${assets && html`<label class="btn sm" for="av-in">Change photo</label><input type="file" id="av-in" accept="image/*" hidden onChange=${(e) => uploadAvatar(e.currentTarget.files[0])} />`}</div>
      <div class="grid2"><div class="field"><label for="s-un">Username</label><input class="input" id="s-un" value=${st.profile.username} onInput=${(e) => saveSettings({ profile: { ...st.profile, username: e.currentTarget.value } })} /></div>
      <div class="field"><label for="s-nm">Name</label><input class="input" id="s-nm" value=${st.profile.name} onInput=${(e) => saveSettings({ profile: { ...st.profile, name: e.currentTarget.value } })} /></div></div>
      <div class="field"><label for="s-bio">Bio</label><textarea class="input" id="s-bio" rows="3" value=${st.profile.bio} onInput=${(e) => saveSettings({ profile: { ...st.profile, bio: e.currentTarget.value } })}></textarea></div>
    </div>
    <div class="card col" style="gap:14px">
      <h2>Cover and writing</h2>

      <div class="field"><span class="lbl">Default text color</span><div class="row gap-8">${COLORS.map((c) => html`<button class=${'swatch' + (st.cover.color === c ? ' on' : '')} style=${`background:${c}`} aria-label=${'Color ' + c} onClick=${() => saveSettings({ cover: { ...st.cover, color: c } })}></button>`)}</div></div>
      <div class="field"><span class="lbl">Claude writes in</span><div class="seg"><button class=${st.lang === 'id' ? 'on' : ''} onClick=${() => saveSettings({ lang: 'id' })}>Indonesian</button><button class=${st.lang === 'en' ? 'on' : ''} onClick=${() => saveSettings({ lang: 'en' })}>English</button></div></div>
    </div>
    <div class="card col" style="gap:12px">
      <h2>Links</h2>

      <form class="row gap-8" onSubmit=${(e) => { e.preventDefault(); const f = e.currentTarget; const url = f.url.value.trim(); if (!url) return; saveSettings({ links: [...(st.links || []), { label: f.label.value.trim(), url }] }); f.reset(); }}>
        <input class="input" name="label" id="l-label" placeholder="Label" style="max-width:150px" /><input class="input grow" name="url" id="l-url" placeholder="https://" /><button class="btn" type="submit">Add</button></form>
    </div>
    <div class="card col" style="gap:12px">
      <h2>Trash</h2>
      ${trash.length === 0 ? html`<span class="muted">Empty.</span>` : html`<div class="list">${trash.map((p) => html`<div class="item"><span class="grow ellipsis">${p.title || 'Untitled post'}</span><button class="btn sm" onClick=${() => savePost(p.id, { deletedAt: null }, 0)}>Restore</button></div>`)}</div>`}
    </div>
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
boot();
</script>
